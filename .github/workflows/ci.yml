# Continuous Integration for NAMM experiments
#
# Runs on every push and pull request to main. This is the quality gate:
# tests must pass before merging. There is no production deployment (CD)
# for a research repo — CI is the safety net.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run AMAT topology unit tests
        run: pytest tests/test_amat_041_037_040.py -v -m amat

      - name: Run pytest suite (fast; skip llm/slow markers)
        run: pytest tests/ -v -m "not llm and not slow"

      # Lightweight smoke: small random search, not the full 50-candidate run.
      # Keeps CI under ~2 minutes while exercising the experiment pipeline.
      - name: Smoke test (minimal random search)
        run: |
          python -c "
          from namm.baselines import random_search
          from namm.schemas.experiment import ExperimentConfig

          config = ExperimentConfig(
              experiment_id='ci-smoke',
              max_order=5,
              num_candidates=10,
              seed=1,
          )
          result = random_search(config)
          assert len(result.candidates) + len(result.rejections) == 10
          print('Smoke OK:', len(result.candidates), 'candidates')
          "

  test-optional:
    name: Optional deps (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with nd optional extra
        run: pip install -e ".[dev,nd]"

      - name: Run ND-frame tests (gudhi/qutip)
        run: pytest tests/test_tda_domain.py tests/test_quantum_domain.py -v -m nd

  # Optional: upload experiment template as a CI artifact for reference.
  publish-template:
    name: Publish experiment template
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload experiment config template
        uses: actions/upload-artifact@v4
        with:
          name: experiment-template-NAMM-2026-001
          path: |
            experiments/NAMM-2026-001/config.yaml
            experiments/NAMM-2026-001/README.md
          retention-days: 30
