experiment_id: NAMM-2026-036
domain: amat_activation_tda
hypothesis_id: H-AMAT-004
protocol_version: amat-activation-tda-v3
description: >
  PCA-reduced activation TDA. Projects hidden state point cloud to d=8 before
  ripser to fix D_eff artifact (24 points in 896-d -> only 2 PCs dominate).
  Sweeps pca_dims x n_turns on chimera prompt, then all focused prompts at best pca_dim.

local_lm:
  model_id: Qwen/Qwen2.5-0.5B-Instruct
  device: cpu
  dtype: auto
  max_new_tokens: 128

activation:
  last_n_layers: 8
  point_cloud_mode: turns_x_layers

sweep:
  pca_dims: [4, 8, 16]
  n_turns: [3, 6, 10]
  chimera_prompt: "What is chimera synchronization and when is partial sync preferable to full consensus?"

focused_prompts:
  - "Explain why consensus in multi-agent systems can be permanently suboptimal."
  - "What is chimera synchronization and when is partial sync preferable to full consensus?"
  - "How does cognitive capitalism allocate compute toward median vs tail cognitive classes?"

certificate_tiers:
  D_EFF_PARTIAL:
    description: "mean_lift_d_eff > 0.5 on best pca_dim"
    condition: "mean_lift_d_eff > 0.5"
  ACTIVATION_EVIDENCE:
    description: "beta1 AND d_eff both show separation"
    condition: "mean_lift_beta_1 > 0.05 AND mean_lift_d_eff > 0.5"
  ACTIVATION_PILOT:
    description: "any separation found"
    condition: "mean_lift_d_eff > 0.0 OR mean_lift_beta_1 > 0.0"

prior_experiments:
  - NAMM-2026-035
  - NAMM-2026-034
  - NAMM-2026-033
