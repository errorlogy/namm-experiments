scientific_stack:
  install: 'pip install -e ".[science]"'
  install_full: 'pip install -e ".[dev,nd,science]"'
  sci_flow_registry: data/sci_flow_registry.yaml
  sci_flow_docs: docs/SCI_FLOW.md
  core_modules:
    - {module: namm.metrics.entropy, domains: [information_theory], deps: [numpy, scipy]}
    - {module: namm.metrics.fuzzy, domains: [fuzzy_logic, multi_agent_consensus], deps: [numpy, networkx]}
    - {module: namm.metrics.catastrophe, domains: [catastrophe_theory, dynamical_systems], deps: [numpy, scipy]}
  optional_extras:
    science: [dit, scikit-fuzzy, ripser, nolds]
    nd: [gudhi, qutip]
  notes: "Catastrophe models are pure numpy/scipy (no pycatastrophe on PyPI). Core CNS/Kuramoto uses scipy.integrate; heavy TDA via gudhi[nd] or ripser[science]."

