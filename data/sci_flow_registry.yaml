# NAMM Sci Flow — declarative routing from hypotheses/experiments to scientific modules.
# Maintainer: Roman Kuznetsov · NAMM research program
# Schema version: 1

schema_version: 1
updated: "2026-08-18"

# Pipeline stages (documentation anchor; enforced by SciFlowRunner)
stages:
  - load_config
  - select_modules
  - check_dependencies
  - run_modules
  - aggregate
  - certificate_check

modules:
  entropy:
    import_path: namm.metrics.entropy
    namm_extra: null
    domains: [information_theory, multi_agent_consensus]
    description: Shannon entropy, mutual information, delta_h_fiber, opinion_entropy

  fuzzy:
    import_path: namm.metrics.fuzzy
    namm_extra: null
    domains: [fuzzy_logic, multi_agent_consensus]
    description: Membership functions and fuzzy contour primitives

  catastrophe:
    import_path: namm.metrics.catastrophe
    namm_extra: null
    domains: [catastrophe_theory, dynamical_systems]
    description: Thom fold/cusp/swallowtail potentials, hysteresis, bifurcation detection

  consensus:
    import_path: namm.metrics.consensus_non_optimality
    namm_extra: null
    domains: [multi_agent_consensus, game_theory]
    description: CNS simulation, welfare gap, fuzzy contours, consensus operators

  kuramoto:
    import_path: namm.metrics.consensus_non_optimality
    namm_extra: null
    domains: [multi_agent_consensus, dynamical_systems]
    description: Kuramoto–vote coupling sweeps (uses consensus module)
    requires: [consensus]

  cognitive_class:
    import_path: namm.metrics.cognitive_class
    namm_extra: null
    domains: [cognitive_class_taxonomy]
    description: Class separation, MAS batches, embedding metrics

  game_theory_2_0:
    import_path: namm.metrics.cognitive_class
    namm_extra: null
    domains: [multi_agent_consensus, game_theory]
    description: GT 2.0 CNE sweeps, hybrid game classes
    requires: [consensus, cognitive_class]

  tda:
    import_path: namm.domains.tda.homology
    namm_extra: nd
    domains: [tda_frame, cognitive_class_taxonomy]
    description: Persistent homology signatures on graph geodesic metric

  antigravity:
    import_path: namm.metrics.antigravity_embedding
    namm_extra: null
    domains: [cognitive_class_taxonomy]
    description: Antigravity embedding distance and sigma sweeps

  information_geometry:
    import_path: namm.metrics.information_geometry
    namm_extra: null
    domains: [anti_median_ai_topology, information_geometry]
    description: Fisher-metric geodesic curvature via logit-gradient norm proxy

  fractal_tda:
    import_path: namm.metrics.fractal_tda
    namm_extra: null
    domains: [anti_median_ai_topology, tda_frame]
    description: Box-counting fractal dimension and layer-wise d_f profiles for H-AMAT-008

branches:
  CNS:
    label: Consensus Non-Optimality
    default_modules: [entropy, fuzzy, consensus]
    hypothesis_prefix: H-CNS
  CCT:
    label: Cognitive Class Taxonomy
    default_modules: [cognitive_class, entropy]
    hypothesis_prefix: H-CCT
  MCG:
    label: Political Mythogenesis + GT 2.0
    default_modules: [consensus, cognitive_class, catastrophe, fuzzy]
    hypothesis_prefix: H-MCG
  AMAT:
    label: Anti-Median AI Topology
    default_modules: [fractal_tda, cognitive_class]
    hypothesis_prefix: H-AMAT

hypothesis_routes:
  H-AMAT-008:
    modules: [fractal_tda, cognitive_class]
    branch: AMAT
  H-CNS-001:
    modules: [entropy, fuzzy, consensus]
    branch: CNS
  H-CNS-002:
    modules: [catastrophe, kuramoto, consensus]
    branch: CNS
  H-CNS-011:
    modules: [entropy, fuzzy, consensus, kuramoto]
    branch: CNS
  H-CCT-001:
    modules: [cognitive_class, entropy, tda]
    branch: CCT
  H-CCT-020:
    modules: [cognitive_class, antigravity]
    branch: CCT
  H-CCT-005:
    modules: [cognitive_class, consensus]
    branch: CCT
  H-MCG-001:
    modules: [consensus, cognitive_class, fuzzy]
    branch: MCG
  H-MCG-005:
    modules: [catastrophe, cognitive_class, consensus]
    branch: MCG
  H-MCG-009:
    modules: [game_theory_2_0, consensus, cognitive_class]
    branch: MCG

experiment_routes:
  NAMM-2026-021:
    modules: [entropy, fuzzy, consensus, kuramoto]
    branch: CNS
    handler: run_021
    hypotheses: [H-CNS-001, H-CNS-004, H-CNS-011]
  NAMM-2026-022:
    modules: [catastrophe, kuramoto, consensus, fuzzy]
    branch: CNS
    handler: run_022
    hypotheses: [H-CNS-002]
