  NAMM-2026-045:
    modules: [cognitive_class]
    branch: AMAT
    handler: run_045
    hypotheses: [H-AMAT-004, H-CCT-020, H-CCT-021]
    description: >
      Real hidden states on Qwen2.5-1.5B — 044 sweet-spot protocol (n_turns=6, pca=8,
