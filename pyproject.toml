[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namm-experiments"
version = "0.1.0"
description = "NAMM Phase 1 experiments — finite graph invariant search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.2",
    "sympy>=1.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "z3-solver>=4.12",
    "python-sat>=1.8",
    "pydantic>=2.5",
    "orjson>=3.9",
    "structlog>=24.1",
    "hydra-core>=1.3",
    "typer>=0.9",
    "hypothesis>=6.92",
    "jsonschema>=4.20",
    "optuna>=3.5",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
nd = [
    "gudhi>=3.9",
    "qutip>=5.0",
]

[project.scripts]
namm = "namm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"namm.matlib.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
